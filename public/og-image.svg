<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F5" />
      <stop offset="100%" stop-color="#F2EFE9" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRose" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#c85378" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#c85378" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glowRose)" />

  <!-- Subtle Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="28" stroke="#1D1D1F" stroke-opacity="0.08" stroke-width="2" />

  <!-- Brand Eyebrow -->
  <g transform="translate(96, 110)">
    <rect width="230" height="38" rx="19" fill="#1D1D1F" fill-opacity="0.06" />
    <circle cx="22" cy="19" r="5" fill="#10B981" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#1D1D1F">SOFTWARE DEVELOPER</text>
  </g>

  <!-- Main Headline -->
  <text x="96" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5" fill="#1D1D1F">
    Izzul
  </text>
  <text x="96" y="300" font-family="Georgia, serif" font-style="italic" font-size="46" fill="#c85378">
    Crafting systems with intentional curiosity.
  </text>

  <!-- Description -->
  <text x="96" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#86868B">
    Full-stack engineering • Clinical &amp; healthcare systems • Story archive
  </text>

  <!-- Bottom Badges / Tech pills -->
  <g transform="translate(96, 470)">
    <!-- Pill 1: PHP & Laravel -->
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#FFFFFF" stroke="#1D1D1F" stroke-opacity="0.1" />
    <text x="70" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1D1D1F">Laravel / PHP</text>

    <!-- Pill 2: Filament TALL -->
    <rect x="156" y="0" width="130" height="42" rx="21" fill="#FFFFFF" stroke="#1D1D1F" stroke-opacity="0.1" />
    <text x="221" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1D1D1F">Filament</text>

    <!-- Pill 3: React & Tailwind -->
    <rect x="302" y="0" width="160" height="42" rx="21" fill="#FFFFFF" stroke="#1D1D1F" stroke-opacity="0.1" />
    <text x="382" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1D1D1F">React &amp; Tailwind</text>

    <!-- Pill 4: Health Tech -->
    <rect x="478" y="0" width="140" height="42" rx="21" fill="#FFFFFF" stroke="#1D1D1F" stroke-opacity="0.1" />
    <text x="548" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1D1D1F">Health Tech</text>
  </g>

  <!-- Domain / Watermark -->
  <text x="1104" y="500" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#86868B">
    izzul.dev
  </text>
</svg>
